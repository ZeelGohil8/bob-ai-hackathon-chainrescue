submission:
  title: "ChainRescue"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Unforeseen Supply chain disruption-such as severe weather, strikes, and temperature breaches in cold chain logistics-cascode across shipments without real-time tracking, causing massive financial losses and spoiled cargo. logistics managers, fleet operators, and cold-chain distributors struggle to manually detect breachesand re-route affected shipments before delivery delays occur. 

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ChainRescue is a Node.js/Express backend that provides real-time supply-chain disruption
    alerts (weather, temperature breaches, port congestion, strikes) and AI-powered fleet
    route optimization using IBM watsonx.ai (Granite). Logistics managers receive instant
    alerts with watsonx.ai impact analyses and actionable rerouting suggestions for affected
    shipments, while a fleet utilization dashboard helps dispatchers assign the nearest
    suitable vehicle to cover disruptions automatically.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time disruption alert ingestion and severity classification (weather, cold-chain temperature breach, port congestion, labor strikes)"
    - "IBM watsonx.ai (Granite) impact analysis — per-event natural-language risk assessment and recommended actions"
    - "Automated cold-chain temperature breach scanner across in-transit shipments"
    - "Fleet utilization optimizer — nearest-available vehicle assignment using haversine distance ranking"
    - "AI-generated fleet insights via watsonx.ai: dispatch recommendations, refuelling priorities, and utilization summary"

  tech_stack:
    languages: ["JavaScript", "Node.js"]
    frameworks: ["Express 4", "Winston", "Morgan"]
    ibm_technologies: ["watsonx.ai", "IBM Granite (ibm/granite-13b-instruct-v2)", "IBM Bob"]
    databases: ["In-memory (demo); PostgreSQL-ready via DATABASE_URL"]
    other: ["Helmet", "express-rate-limit", "CORS", "dotenv", "uuid", "Jest", "nodemon"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The seamless integration of IBM watsonx.ai Granite for two distinct AI tasks in one
    backend: per-disruption impact analysis that reads live shipment data and returns
    structured recommendations, and holistic fleet insight generation that synthesises
    utilization metrics with active disruption counts to produce prioritised dispatch
    and maintenance actions — all with a clean fallback for offline/dev environments.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Fleet and shipment data currently lives in an in-memory mock store (mockData.js);
    a production deployment would replace this with a live PostgreSQL database and
    IoT/webhook ingestion. The rerouting algorithm uses a simple haversine detour stub
    rather than a full graph-based routing engine (e.g. OR-Tools or a mapping API).
    watsonx.ai calls are synchronous — a job queue (Bull/BullMQ) would improve
    throughput under high alert volume.

