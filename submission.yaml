submission:
  title: "ChainRescue"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Unforeseen Supply chain disruption-such as severe weather, strikes, and temperature breaches 
    in cold chain logistics-cascode across shipments without real-time tracking, causing massive 
    financial losses and spoiled cargo. logistics managers, fleet operators, and cold-chain distributors 
    struggle to manually detect breachesand re-route affected shipments before delivery delays occur. 

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    solution_summary: >
  We built ChainRescue, an AI assistant that tracks supply chain disruptions in real time. It finds alternative routes for stuck shipments, puts idle trucks back to work, and checks temperature sensors
 to protect perishable goods before they spoil.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time disruption monitoring and dynamic re-routing recommendations for affected cargo"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Automated idle fleet asset tracking and redeployment to balance overloaded routes"
    - "IoT cold-chain sensor log analysis to detect temperature breaches before delivery"
    - "Regulatory severity classification for perishable cargo compliance and safety"                               # optional 4th
    - "Interactive supervisor dashboard powered by IBM Bob for swift operational decisions"                               # optional 5th

  tech_stack:
    languages: ["TypeScript", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "Express.js", "Node.js"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["In-Memory DB"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker", "GitHub Actions", "Vite"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
     We are most proud of building a fully containerized, multi-stage Docker application entirely
      using IBM Bob's agentic workflows. Our solution seamlessly integrates real-time supply chain 
      disruption tracking with IoT cold-chain sensor monitoring to automatically detect temperature
       breaches and optimize fleet routing.


  known_limitations: >                 # Optional but recommended — be honest about gaps
    Due to hackathon time constraints, the current implementation uses in-memory mock data for 
    IoT temperature sensors and fleet locations rather than a live external database, and complex
     route optimizations rely on simulated decision models.

